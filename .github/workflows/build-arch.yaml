name: Build TerraOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Run the entire job inside a native Arch Linux container environment
    container:
      image: archlinux:latest
      options: --privileged # Required for mounting loop devices/images during build

    strategy:
      matrix:
        board:
          - octopus

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Arch Environment & Dependencies
      run: |
        # Update keyring and sync package databases
        pacman -Syu --noconfirm
        
        # Install essential tools
        pacman -S --needed --noconfirm base-devel git sudo curl wget util-linux e2fsprogs zstd zip pv coreutils sed findutils squashfs-tools tar lsof arch-install-scripts cloud-utils

        # Create a non-root 'build' user (makepkg cannot run as root)
        useradd -m build
        chown -R build:build $GITHUB_WORKSPACE
        echo "build ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

    - name: Build TerraOS
      env:
        BOARD_NAME: ${{ matrix.board }}
      run: |
        set -e # Exit immediately on error

        # Determine initial board variant
        CURRENT_BOARD="${BOARD_NAME}"
        
        if [ "${CURRENT_BOARD}" == "jacuzzi" ]; then
          bash ./scripts/build_stage1.sh terraos_jacuzzi
          CURRENT_BOARD="jacuzzi_makomo"
        else
          bash ./scripts/build_stage1.sh terraos
        fi

        # Install AUR packages if necessary
        # NOTE: Building yay from source takes time. If you don't have strict AUR deps, skip this.
        # Assuming you might need some AUR packages, we install 'yay' binary or build it.
        # For robustness in CI, let's try installing pre-built binaries if available, 
        # otherwise fall back to building. Here we assume standard repos cover most needs 
        # based on the list provided earlier. If specific AUR pkgs are needed, uncomment below:
        
        # sudo -u build bash << 'EOF'
        #   cd /tmp
        #   git clone https://aur.archlinux.org/yay.git
        #   cd yay
        #   makepkg -si --noconfirm
        # EOF

        # Continue build process
        bash ./scripts/build_aur_packages.sh || true # Allow failure if no AUR pkgs defined
        bash ./scripts/download_images.sh
        
        # Call build_all.sh without undefined variables
        # If your script expects arguments, pass literal strings or read from files here.
        bash ./scripts/build_all.sh

        # Handle post-build renaming/moving if jacuzzi_makomo was used
        if [ "${CURRENT_BOARD}" == "jacuzzi_makomo" ]; then
          # Example: Rename output file from makomo variant back to expected name
          # Adjust filenames according to your actual build outputs
          if [ -f "./jacuzzi_makomo.bin" ]; then
            mv "./jacuzzi_makomo.bin" "./jacuzzi.bin"
          fi
          CURRENT_BOARD="jacuzzi"
        fi

        # Export final board name for upload step
        echo "FINAL_BOARD=${CURRENT_BOARD}" >> $GITHUB_ENV

    - name: Upload built shim
      uses: softprops/action-gh-release@v2
      with:
        name: TerraOS ${{ inputs.tag }}
        tag_name: ${{ inputs.tag }}
        files: ./${{ env.FINAL_BOARD }}.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
