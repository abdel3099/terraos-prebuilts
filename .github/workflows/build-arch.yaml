name: Build TerraOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Run the entire job inside a native Arch Linux container environment
    container:
      image: archlinux:latest
      options: --privileged # Kept in case your build scripts mount loop devices/images

    strategy:
      matrix:
        board:
          - octopus

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Upgraded from v1 to avoid modern node deprecations

    - name: Prepare Arch Environment & Dependencies
      run: |
        # Update keyring and sync package databases
        pacman -Syu --noconfirm
        pacman -S --needed --noconfirm base-devel git sudo

        # Create a non-root 'build' user (makepkg cannot run as root)
        useradd -m build
        chown -R build:build $GITHUB_WORKSPACE
        echo "build ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

    - name: Build TerraOS
      env:
        board: ${{ matrix.board }}
      run: |
        # Switch to the non-root build user to install yay
        sudo -u build bash << 'EOF'
          git clone https://archlinux.org /tmp/yay-bin
          cd /tmp/yay-bin
          makepkg -si --noconfirm
        EOF

        # Install standard packages via Pacman & AUR packages via yay
        packages=(
          wget util-linux e2fsprogs zstd zip pv coreutils 
          sed findutils squashfs-tools tar lsof arch-install-scripts 
          cloud-utils
        )

        for package in "${packages[@]}"; do
          if pacman -Si "$package" &>/dev/null; then
            pacman -S --needed --noconfirm "$package"
          else
            sudo -u build yay -S --needed --noconfirm "$package"
          fi
        done

        # Re-verify permissions for the runner build steps
        mkdir -p build
        
        if [ "${board}" == "jacuzzi" ]; then
          bash ./scripts/build_stage1.sh terraos_jacuzzi
          board="jacuzzi_makomo"
        else
          bash ./scripts/build_stage1.sh terraos
        fi

        bash ./scripts/build_aur_packages.sh
        bash ./scripts/download_images.sh
        bash ./scripts/build_all.sh "$shim" "$reco" "$reven"

        if [ "${board}" == "jacuzzi_makomo" ]; then
          makomoshim="$shim"
          shim=$(echo "$shim" | sed 's/jacuzzi_makomo/jacuzzi/')
          mv "$makomoshim" "$shim"
          board="jacuzzi"
        fi

    - name: Upload built shim
      uses: softprops/action-gh-release@v2
      with:
        name: TerraOS ${{ inputs.tag }}
        tag_name: ${{ inputs.tag }}
        files: ./${{ matrix.board }}.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
