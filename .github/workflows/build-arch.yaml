name: Build TerraOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Pin to a specific Arch Linux image to avoid breaking changes from rolling releases
    # Check https://hub.docker.com/r/archlinux/tags for recent stable dates
    container:
      image: archlinux:base-2026-10-01 # Replace with a recent valid date tag
      options: --privileged

    strategy:
      matrix:
        board:
          - octopus

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Arch Environment & Dependencies
      run: |
        set -e # Exit immediately on error
        
        # Initialize keyring and update system
        pacman-key --init
        pacman-key --populate archlinux
        pacman -Syu --noconfirm
        
        # Install essential build tools
        pacman -S --needed --noconfirm \
          base-devel \
          git \
          sudo \
          wget \
          curl \
          unzip \
          rsync \
          bc \
          util-linux \
          e2fsprogs \
          zstd \
          squashfs-tools \
          arch-install-scripts \
          cloud-utils

        # Create non-root build user
        useradd -m build
        chown -R build:build $GITHUB_WORKSPACE
        
        # Allow passwordless sudo for build user
        echo "build ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

    - name: Install Yay (AUR Helper)
      run: |
        set -e
        # Clone yay-bin as the build user to avoid root-owned cache issues
        sudo -u build bash << 'EOF'
          cd ~
          git clone https://aur.archlinux.org/yay-bin.git
          cd yay-bin
          makepkg -si --noconfirm
        EOF

    - name: Build TerraOS
      env:
        BOARD: ${{ matrix.board }}
        # Define default values for variables used in scripts to prevent unbound errors
        SHIM: ""
        RECO: ""
        REVEN: ""
      run: |
        set -e
        cd $GITHUB_WORKSPACE
        
        # Export variables so child scripts can see them
        export BOARD="$BOARD"
        
        # Run stage 1 based on board
        if [ "$BOARD" == "jacuzzi" ]; then
          bash ./scripts/build_stage1.sh terraos_jacuzzi
          # Note: If jacuzzi logic changes the effective board name for later steps, 
          # handle it here. Based on your original code, it seems to swap names.
          EFFECTIVE_BOARD="jacuzzi_makomo"
        else
          bash ./scripts/build_stage1.sh terraos
          EFFECTIVE_BOARD="$BOARD"
        fi

        # Install additional AUR packages if needed by the build scripts
        # Using yay as the build user
        sudo -u build yay -S --needed --noconfirm lsof pv zip tar findutils sed coreutils || true

        # Continue with remaining build steps
        bash ./scripts/build_aur_packages.sh
        bash ./scripts/download_images.sh
        
        # Pass empty strings if not provided, ensuring scripts don't fail on unset vars
        bash ./scripts/build_all.sh "$SHIM" "$RECO" "$REVEN"

        # Handle post-build renaming/moving if applicable
        if [ "$EFFECTIVE_BOARD" == "jacuzzi_makomo" ]; then
          if [ -n "$SHIM" ] && [ -f "$SHIM" ]; then
            NEW_SHIM=$(echo "$SHIM" | sed 's/jacuzzi_makomo/jacuzzi/')
            mv "$SHIM" "$NEW_SHIM"
            EFFECTIVE_BOARD="jacuzzi"
          fi
        fi
        
        # Store final board name for upload step
        echo "FINAL_BOARD=$EFFECTIVE_BOARD" >> $GITHUB_ENV

    - name: Upload built shim
      uses: softprops/action-gh-release@v2
      with:
        name: TerraOS ${{ inputs.tag }}
        tag_name: ${{ inputs.tag }}
        # Adjust glob pattern if multiple files are generated
        files: ./${{ env.FINAL_BOARD }}*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
